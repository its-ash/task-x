name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Git identity for tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Rust format
        run: cargo fmt --manifest-path runtime/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path runtime/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path runtime/Cargo.toml
      - name: Extension tests (uses the debug runtime built above)
        run: |
          npm --prefix extension ci --no-audit --no-fund
          npm --prefix extension test
