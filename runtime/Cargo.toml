[package]
name = "task-x-runtime"
version = "0.1.39"
edition = "2024"
rust-version = "1.85"
description = "Model-agnostic coding agent runtime: CLI, JSON-RPC server, and MCP server"
license = "MIT"
publish = false

[[bin]]
name = "task-x-runtime"
path = "src/main.rs"

[dependencies]
globset = "0.4"
ignore = "0.4"
streaming-iterator = "0.1"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
ring = "0.17"
reqwest = { version = "0.13", features = ["json", "stream"] }
similar = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net", "process", "signal"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
url = "2"
tokio-tungstenite = "0.30"

[dev-dependencies]
# test-util: a paused clock, so wake-up tests skip their 30-minute waits.
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net", "process", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
